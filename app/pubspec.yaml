name: postern
description: Postern — SSH terminal and two-panel file manager; hosts synced through Shard.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  grpc: ^5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  window_manager: ^0.5.2
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
