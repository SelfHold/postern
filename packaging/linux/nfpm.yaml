# Linux packages (deb, rpm, archlinux) for Postern. Built by `make package-linux`
# from the output of make build-linux (bundle in builds/linux); paths are relative to the repo root.
# The Flutter bundle is relocatable and finds its data next to the binary, so it
# stays together under /opt/selfhold/postern. Icon and menu caches are refreshed by the
# package managers' own hooks (pacman hooks, dpkg and rpm file triggers).
name: postern
arch: amd64
platform: linux
version: ${PKG_VERSION}
release: 1
section: net
priority: optional
maintainer: SelfHold <https://github.com/SelfHold>
vendor: SelfHold
homepage: https://github.com/SelfHold/postern
license: GPL-3.0-only
description: |-
  SSH terminal and two-panel (Midnight Commander style) file manager.

contents:
  - src: builds/linux
    dst: /opt/selfhold/postern
    type: tree
  - src: /opt/selfhold/postern/postern
    dst: /usr/bin/postern
    type: symlink
  - src: packaging/linux/dev.selfhold.postern.desktop
    dst: /usr/share/applications/dev.selfhold.postern.desktop
    file_info: { mode: 0644 }
  - src: branding/postern_icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.selfhold.postern.svg
    file_info: { mode: 0644 }
  - src: app/assets/icon/postern.png
    dst: /usr/share/icons/hicolor/256x256/apps/dev.selfhold.postern.png
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/postern/LICENSE
    packager: archlinux
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/postern/copyright
    packager: deb
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/postern/LICENSE
    type: license
    packager: rpm
    file_info: { mode: 0644 }

# Library names differ per distribution.
overrides:
  deb:
    depends:
      - "libgtk-3-0t64 | libgtk-3-0"
  rpm:
    depends:
      - "gtk3"
  archlinux:
    depends:
      - "gtk3"
