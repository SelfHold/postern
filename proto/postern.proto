syntax = "proto3";

// The API between the Postern core (inside the app's process:
// desktopbind on desktops, mobilebind on Android) and its Flutter UI. The core owns SSH connections,
// file transfers and the host list; the app only draws.
package selfhold.postern.v1;

option go_package = "github.com/SelfHold/postern/core/rpc/pb";

service Core {
  // State: versions and Shard status.
  rpc GetState(Empty) returns (State);
  // Events streams changes (hosts, sync state).
  rpc Events(Empty) returns (stream Event);

  // --- hosts (synced through Shard when sync is on) -------------------
  rpc ListHosts(Empty) returns (HostList);
  // SaveHost creates (id = "") or replaces a host.
  rpc SaveHost(Host) returns (Host);
  rpc DeleteHost(HostRef) returns (Empty);
  // ProbeHostKey connects and returns the server's key, compared with the
  // key the host has on record.
  rpc ProbeHostKey(HostRef) returns (HostKey);
  // TrustHostKey records the key (authorized_keys format) on the host.
  rpc TrustHostKey(TrustRequest) returns (Host);

  // --- terminal -------------------------------------------------------
  // Shell: the first message is `open`; then data and resizes. The core
  // answers `opened`, then data, and `closed` at the end.
  rpc Shell(stream ShellIn) returns (stream ShellOut);

  // --- files (side "" = this device, otherwise a host id) -------------
  rpc ListDir(DirRequest) returns (DirListing);
  rpc MakeDir(PathRequest) returns (Empty);
  rpc Remove(PathsRequest) returns (Empty);
  rpc Rename(RenameRequest) returns (Empty);
  // Transfer copies (or moves) files and folders between two sides and
  // reports progress; cancelling the call stops it.
  rpc Transfer(TransferRequest) returns (stream TransferProgress);

  // --- Shard ------------------------------------------------------
  // EnableSync asks Shard for pairing (if needed) and returns the code
  // to show; the result comes as a SYNC event.
  rpc EnableSync(Empty) returns (SyncState);
  rpc DisableSync(Empty) returns (SyncState);
  // SyncNow pushes local changes and pulls remote ones.
  rpc SyncNow(Empty) returns (SyncState);
  // RequestAccess asks Shard (while paired) for the shared server list
  // and the SSH keys of its safe; the code to show comes back.
  rpc RequestAccess(Empty) returns (SyncState);
  // SafeKeys lists the SSH keys of Shard's password safe (public part
  // only); needs sync on and the "ssh_keys" permission in Shard.
  rpc SafeKeys(Empty) returns (SafeKeyList);
}

message Empty {}

message State {
  string core_version = 1;
  string core_build = 2;
  string platform = 3;
  SyncState sync = 4;
}

message SyncState {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    OFF = 1;          // sync switched off
    NOT_RUNNING = 2;  // switched on, Shard not found
    NO_VAULT = 3;
    LOCKED = 4;
    PAIRING = 5;      // waiting for the user in Shard (code)
    OFFLINE = 6;      // reads work, writes wait
    SYNCED = 7;
    ERROR = 8;
  }
  Phase phase = 1;
  bool enabled = 2;
  bool available = 3;      // Shard answers on this device
  string pairing_code = 4; // "123 456" while PAIRING
  string error = 5;
  bool pending = 6;        // local changes not uploaded yet
  int64 last_sync_ms = 7;
  string device_name = 8;
  bool shared_servers = 9; // hosts are Shard's shared server list
  bool safe_keys = 10;     // the SSH keys of Shard's safe can be used
}

message Event {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    HOSTS = 1;
    SYNC = 2;
  }
  Kind kind = 1;
  string message = 2;
}

message Host {
  string id = 1;
  string name = 2;
  string group = 3;
  string address = 4;
  uint32 port = 5;     // 0 = 22
  string user = 6;
  enum Auth {
    AUTH_UNSPECIFIED = 0;
    PASSWORD = 1;
    KEY = 2;
    AGENT = 3;          // ssh-agent ($SSH_AUTH_SOCK), desktops only
    SAFE_KEY = 4;       // a key of Shard's password safe (key_id)
  }
  Auth auth = 7;
  string password = 8;
  string private_key = 9;  // PEM / OpenSSH
  string passphrase = 10;
  repeated string host_keys = 11; // trusted host keys, authorized_keys format
  int64 updated_ms = 12;
  string notes = 13;
  string start_dir = 14;   // first folder in the file manager
  string key_id = 15;      // SAFE_KEY: id of the safe entry
  repeated string tags = 16;
  string jump_id = 17;     // connect through this host ("" = direct)
}

message HostList {
  repeated Host hosts = 1;
}

message HostRef {
  string id = 1;
}

// ProbeHostKey answers with the key the server shows.
message HostKey {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    KNOWN = 1;    // matches the key on record
    UNKNOWN = 2;  // no key on record
    CHANGED = 3;  // differs from the key on record
  }
  Status status = 1;
  string key = 2;          // authorized_keys format
  string fingerprint = 3;  // SHA256:...
  string type = 4;
}

message TrustRequest {
  string id = 1;
  string key = 2;
  // replace = true drops the keys on record (the server's key changed and
  // the user confirmed it); otherwise the key is added.
  bool replace = 3;
}

message ShellIn {
  message Open {
    string host_id = 1;
    uint32 cols = 2;
    uint32 rows = 3;
  }
  message Resize {
    uint32 cols = 1;
    uint32 rows = 2;
  }
  oneof msg {
    Open open = 1;
    bytes data = 2;
    Resize resize = 3;
  }
}

message ShellOut {
  oneof msg {
    bool opened = 1;
    bytes data = 2;
    string closed = 3; // "" = the shell exited normally, else the error
  }
}

message Entry {
  string name = 1;
  bool dir = 2;
  bool link = 3;
  int64 size = 4;
  int64 modified_ms = 5;
  uint32 mode = 6;
}

message DirRequest {
  string side = 1;
  string path = 2; // "" = home
}

message DirListing {
  string path = 1; // absolute, cleaned
  repeated Entry entries = 2;
}

message PathRequest {
  string side = 1;
  string path = 2;
}

message PathsRequest {
  string side = 1;
  repeated string paths = 2;
}

message RenameRequest {
  string side = 1;
  string from = 2;
  string to = 3;
}

message TransferRequest {
  string src_side = 1;
  repeated string src_paths = 2;
  string dst_side = 3;
  string dst_dir = 4;
  bool move = 5;
  bool overwrite = 6;
}

message TransferProgress {
  int64 done_bytes = 1;
  int64 total_bytes = 2;
  int32 done_files = 3;
  int32 total_files = 4;
  string current = 5;
  bool finished = 6;
}

message SafeKey {
  string id = 1;
  string title = 2;
  string key_type = 3;
  string fingerprint = 4;
  string public_key = 5;
  string comment = 6;
}

message SafeKeyList {
  repeated SafeKey keys = 1;
  // Why the list is empty when it is not available ("" = it is).
  string unavailable = 2;
}
